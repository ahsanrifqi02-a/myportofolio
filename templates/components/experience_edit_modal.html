<div id="edit-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-experience-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form ubah pengalaman"></button>
    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form ubah pengalaman">×</button>
        <h2 id="edit-experience-modal-title">Ubah Pengalaman</h2>
        <form id="edit-experience-form" class="project-form">
            <input type="hidden" name="id" id="edit-exp-id">
            <div class="form-group">
                <label for="edit-exp-title">Role / Position Title</label>
                <input type="text"
                       name="title"
                       id="edit-exp-title"
                       maxlength="255"
                       required
                       placeholder="e.g. Asisten Dosen PBP">
            </div>
            <div class="form-group">
                <label for="edit-exp-category">Category</label>
                <select name="category" id="edit-exp-category" class="form-select">
                    <option value="internship">Internship</option>
                    <option value="research">Research</option>
                    <option value="volunteer">Volunteer</option>
                    <option value="part-time">Part-Time</option>
                    <option value="full-time">Full-Time</option>
                    <option value="freelance">Freelance</option>
                </select>
            </div>
            <div class="form-group">
                <label for="edit-exp-description">Description / Responsibilities</label>
                <textarea name="description"
                          id="edit-exp-description"
                          rows="4"
                          required
                          placeholder="Describe your role, responsibilities, and achievements..."></textarea>
            </div>
            <div class="form-group">
                <label for="edit-exp-started_at">Start Date</label>
                <input type="date" name="started_at" id="edit-exp-started_at">
            </div>
            <div class="form-group">
                <label for="edit-exp-ended_at">End Date (Leave empty if ongoing)</label>
                <input type="date" name="ended_at" id="edit-exp-ended_at">
            </div>
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-experience-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
