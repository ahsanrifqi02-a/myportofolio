<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ahsan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">AHSAN</a>
            
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="menu-icon">
                <span class="nav-icon"></span>
            </label>

            <nav class="nav-menu">
                <a href="{% url 'main:show_main' %}">Home</a>
                <a href="{% url 'main:show_about' %}">About</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_skills' %}">Skills</a>
                <a href="{% url 'main:show_projects' %}">Projects</a>
                <a href="{% url 'main:show_contact' %}">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Contacts Section -->
        <section class="section" id="contact">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title">Contact</h2>
                </div>
                
                <div class="contact-content" style="text-align: left; max-width: 600px;">
                    <p style="margin-bottom: 2rem; font-size: 1.1rem; color: var(--paper); opacity: 0.85;">Open for new opportunities and collaboration. Feel free to reach out via my email or social networks below.</p>
                    <div style="display: flex; gap: 1rem; justify-content: flex-start; flex-wrap: wrap;">
                        <a href="https://github.com/ahsanrifqi02-a" class="btn-link" style="display: inline-flex; align-items: center; gap: 0.5rem;" target="_blank" rel="noopener">
                            <img src="/static/img/github.svg" alt="GitHub" width="16" height="16" style="filter: brightness(0);">
                            GitHub
                        </a>
                        <a href="https://www.linkedin.com/in/ahsan-rifqi-prasetyo-828022380/" class="btn-link" style="display: inline-flex; align-items: center; gap: 0.5rem;" target="_blank" rel="noopener">
                            <img src="/static/img/linkedin.svg" alt="LinkedIn" width="16" height="16" style="filter: brightness(0);">
                            LinkedIn
                        </a>
                        <a href="mailto:ahsanrifqi02@gmail.com" class="btn-link secondary">
                            Email Me
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container" style="text-align: left;">
            <p>&copy; 2026 {{ fullname|default:name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
