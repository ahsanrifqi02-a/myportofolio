{% extends 'base.html' %}
{% load static %}

{% block meta %}
<title>Contact - Ahsan</title>
{% endblock meta %}

{% block content %}
<main>

        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Contact</h2>
            </div>
            
            <div class="contact-content" style="text-align: left; max-width: 600px;">

                <div style="display: flex; gap: 1rem; justify-content: flex-start; flex-wrap: wrap;">

                        GitHub
                    </a>
                    <a href="https://www.linkedin.com/in/ahsan-rifqi-prasetyo-828022380/" class="btn-link" style="display: inline-flex; align-items: center; gap: 0.5rem;" target="_blank" rel="noopener">
                        <img src="{% static 'img/linkedin.svg' %}" alt="LinkedIn" width="16" height="16" style="filter: brightness(0);">
                        LinkedIn
                    </a>
                    <a href="mailto:ahsanrifqi02@gmail.com" class="btn-link secondary">
                        Email Me
                    </a>
                </div>
            </div>
        </div>
