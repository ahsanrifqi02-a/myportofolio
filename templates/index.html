{% extends 'base.html' %}
{% load static %}
{% block meta %}
<title>Portfolio - Ahsan</title>
{% endblock meta %}
{% block content %} 
    <main>
        <!-- Home / Hero Section -->
        <section class="hero" id="home">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <div class="hero-kicker-wrapper">
                        <div>
                            <div class="typing-container kicker-container" style="text-align: left;">
                                <span class="hidden-placeholder hero-kicker">Web Portofolio</span>
                                <span class="typing-text hero-kicker">Web Portofolio</span>
                            </div>
                        </div>
                    </div>
                    <div style="text-align: center;">
                        <h1 class="typing-container h1-container">
                            <span class="hidden-placeholder h1">{{ fullname }}</span>
                            <span class="typing-text h1">{{ fullname }}</span>
                        </h1>
                    </div>
                </div>
                <div class="hero-details">
                    
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>
                                <div class="typing-container meta-container">
                                    <span class="hidden-placeholder">{{ npm }}</span>
                                    <span class="typing-text meta-text-1">{{ npm }}</span>
                                </div>
                            </dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>
                                <div class="typing-container meta-container">
                                    <span class="hidden-placeholder">{{ study_program }}</span>
                                    <span class="typing-text meta-text-2">{{ study_program }}</span>
                                </div>
                            </dd>
                        </div>
                    </dl>
                    
                </div>
                <!-- Skills Showcase -->
                <div class="hero-skills" style="margin-top: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.75rem;">
                    <div class="skills-icons-grid" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 0.85rem; align-items: center;">
                        <div class="skill-icon-item" title="Python" style="display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                            <img src="{% static 'img/skills/python.svg' %}" alt="Python" width="36" height="36">
                        </div>
                        <div class="skill-icon-item" title="Django" style="display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                            <img src="{% static 'img/skills/django.svg' %}" alt="Django" width="36" height="36">
                        </div>
                        <div class="skill-icon-item" title="Java" style="display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                            <img src="{% static 'img/skills/java.svg' %}" alt="Java" width="36" height="36">
                        </div>
                        <div class="skill-icon-item" title="HTML5 & CSS3" style="display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                            <img src="{% static 'img/skills/html5.svg' %}" alt="HTML5" width="36" height="36">
                        </div>
                        <div class="skill-icon-item" title="CSS" style="display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                            <img src="{% static 'img/skills/css.svg' %}" alt="CSS" width="36" height="36">
                        </div>
                        <div class="skill-icon-item" title="Git" style="display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                            <img src="{% static 'img/skills/git.svg' %}" alt="Git" width="36" height="36">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    {% endblock content %}
