<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Ahsan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">AHSAN</a>
            
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="menu-icon">
                <span class="nav-icon"></span>
            </label>

            <nav class="nav-menu">
                <a href="{% url 'main:show_main' %}">Home</a>
                <a href="{% url 'main:show_about' %}">About</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_skills' %}">Skills</a>
                <a href="{% url 'main:show_contact' %}">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Home / Hero Section -->
        <section class="hero" id="home">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <div class="hero-kicker-wrapper">
                        <div>
                            <div class="typing-container kicker-container" style="text-align: left;">
                                <span class="hidden-placeholder hero-kicker">Web Portofolio</span>
                                <span class="typing-text hero-kicker">Web Portofolio</span>
                            </div>
                        </div>
                    </div>
                    <div style="text-align: center;">
                        <h1 class="typing-container h1-container">
                            <span class="hidden-placeholder h1">{{ fullname }}</span>
                            <span class="typing-text h1">{{ fullname }}</span>
                        </h1>
                    </div>
                </div>
                <div class="hero-details">
                    
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>
                                <div class="typing-container meta-container">
                                    <span class="hidden-placeholder">{{ npm }}</span>
                                    <span class="typing-text meta-text-1">{{ npm }}</span>
                                </div>
                            </dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>
                                <div class="typing-container meta-container">
                                    <span class="hidden-placeholder">{{ study_program }}</span>
                                    <span class="typing-text meta-text-2">{{ study_program }}</span>
                                </div>
                            </dd>
                        </div>
                    </dl>
                    
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container" style="text-align: left;">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
